aid: prediko
name: Prediko
description: >-
  Prediko is an AI-powered inventory management and planning platform for Shopify
  D2C and B2B brands, covering demand forecasting, supply and replenishment
  planning, purchase-order management, raw-materials and bill-of-materials
  tracking, and multi-location inventory. Prediko exposes a public REST API
  (https://api.prediko.io/api/v1) authenticated with pk_live_ bearer API keys,
  letting merchants and integrators manage orders, read SKU stock levels and
  procurement suggestions, sync suppliers and warehouses, and automate inventory
  workflows. "Pia" is Prediko's AI inventory agent. The company is backed by
  Techstars.
